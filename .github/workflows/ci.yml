name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e ".[web,dev]"
      - name: Compile Streamlit dashboard
        run: python -m py_compile app.py
      - name: Test
        run: python -m pytest -q
      - name: Smoke test Streamlit server startup
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8501/_stcore/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/streamlit-smoke.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/streamlit-smoke.log
            echo "Streamlit did not become healthy within 30 seconds"
            exit 1
          fi
          echo "Streamlit server startup passed"
