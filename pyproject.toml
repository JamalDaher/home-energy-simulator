[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-energy-simulator"
version = "1.0.0"
description = "Solar, battery and generator simulation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
web = ["streamlit>=1.35", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
home-energy = "home_energy_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
