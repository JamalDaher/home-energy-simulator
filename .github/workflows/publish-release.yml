name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected semantic version like v1.2.0"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test release candidate
        run: |
          python -m pip install -e ".[web,dev]"
          python -m py_compile app.py
          python -m pytest -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Home Energy Simulator $VERSION" \
            --notes-file docs/v1.2-release-candidate.md \
            --verify-tag=false
